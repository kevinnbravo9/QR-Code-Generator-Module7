version: '3.8'

services:
  qr_code_app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - QRCODE_DIR=/app/qr_codes
      - FILL_COLOR=black
      - BACK_COLOR=white
    volumes:
      - ./qr_codes:/app/qr_codes  # Maps the local 'qr_codes' directory to '/app/qr_codes' in the container
    command: ["--url", "https://github.com/kevinnbravo9/QR-Code-Generator-Module7"]
